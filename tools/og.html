<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OG card source — 1200×630</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500&family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* Source for og.png. Regenerate with:
     "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless \
       --window-size=1200,630 --screenshot=og.png og.html                        */
  * { box-sizing: border-box; margin: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden; position: relative;
    background: #0b0f1c; color: #f5f7ff;
    font-family: Archivo, sans-serif;
    display: flex; flex-direction: column; justify-content: center;
    padding: 74px 80px;
  }
  .face {
    position: absolute; right: 74px; top: 50%; translate: 0 -50%;
    width: 320px; aspect-ratio: 4 / 5;
    border-radius: 24px; padding: 3px;
    background: linear-gradient(150deg, #8b5cf6, #22d3ee);
    box-shadow: 0 30px 70px -30px rgba(0, 0, 0, .9);
  }
  .face img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: 50% 15%; border-radius: 21px; }
  .blob { position: absolute; border-radius: 50%; filter: blur(90px); mix-blend-mode: screen; }
  .b1 { width: 700px; height: 700px; top: -280px; left: -160px; background: radial-gradient(circle, #7c3aed, transparent 65%); opacity: .75; }
  .b2 { width: 620px; height: 620px; bottom: -300px; right: -120px; background: radial-gradient(circle, #0891b2, transparent 65%); opacity: .7; }
  .b3 { width: 520px; height: 520px; top: 120px; right: 220px; background: radial-gradient(circle, #4338ca, transparent 68%); opacity: .55; }
  .grid {
    position: absolute; inset: 0; opacity: .06;
    background-image: linear-gradient(to right, #fff 1px, transparent 1px), linear-gradient(to bottom, #fff 1px, transparent 1px);
    background-size: 60px 60px;
    mask-image: radial-gradient(ellipse 80% 70% at 30% 20%, #000 20%, transparent 75%);
  }
  main { position: relative; }
  .pill {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 8px 16px; border: 1px solid rgba(255,255,255,.16); border-radius: 999px;
    background: rgba(25,33,52,.6); font-size: 17px; color: #b6c0d9;
  }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #34d399; }
  h1 {
    max-width: 700px;
    margin: 26px 0 0; font-family: "Space Grotesk", sans-serif; font-weight: 700;
    font-size: 96px; line-height: .95; letter-spacing: -.045em;
  }
  h1 span {
    background: linear-gradient(96deg, #8b5cf6, #22d3ee 60%, #6366f1);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }
  .tag {
    max-width: 700px;
    margin-top: 22px; font-family: "Space Grotesk", sans-serif; font-weight: 500;
    font-size: 34px; letter-spacing: -.02em;
  }
  .tag i { font-style: normal; color: #8792ad; }
  .strip { display: flex; gap: 36px; max-width: 700px; flex-wrap: wrap; margin-top: 40px; font-family: "JetBrains Mono", monospace; font-size: 18px; color: #b6c0d9; }
  .strip b { display: block; font-size: 15px; font-weight: 400; color: #8792ad; letter-spacing: .06em; text-transform: uppercase; }
  .strip u {
    text-decoration: none; font-weight: 700; font-size: 24px;
    background: linear-gradient(96deg, #8b5cf6, #22d3ee);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }
</style>
</head>
<body>
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="grid"></div>

  <figure class="face"><img src="../headshot.jpg" alt=""></figure>

  <main>
    <span class="pill"><span class="dot"></span> AI/ML Engineer &amp; Data Scientist · IEEE published</span>
    <h1>Manoj<br><span>Mareedu</span></h1>
    <p class="tag"><i>I ship</i> production systems, not notebooks.</p>
    <div class="strip">
      <div><b>Live demos</b><u>4</u></div>
      <div><b>Multi-agent GenAI</b><u>LangGraph · RAG</u></div>
      <div><b>MLOps</b><u>ZenML · MLflow · DVC</u></div>
    </div>
  </main>
</body>
</html>
